<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070b1b">
    <title>Starfield</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="game-shell">
      <h1 class="visually-hidden">Starfield</h1>
      <canvas
        id="game"
        width="640"
        height="480"
        aria-label="Starfield game canvas"
        tabindex="0"
      ></canvas>
      <p id="instructions">
        Arrow keys steer and thrust. Comma and period tune the radio. Space advances the story.
      </p>
      <section id="touch-controls" class="touch-controls" aria-label="Touch controls" hidden>
        <p id="touch-instructions">
          ◀/▶ rotate, ▲ thrust, ▼ advance/interact, O tune up, X tune down.
        </p>
        <div class="touch-control-row">
          <div class="dpad" aria-label="Movement controls">
            <button class="control control-up" type="button" data-control="thrust" aria-label="Thrust">▲</button>
            <button class="control control-left" type="button" data-control="left" aria-label="Rotate left">◀</button>
            <button class="control control-down" type="button" data-control="advance" aria-label="Advance or interact">▼</button>
            <button class="control control-right" type="button" data-control="right" aria-label="Rotate right">▶</button>
          </div>
          <div class="action-controls" aria-label="Radio controls">
            <button class="control control-o" type="button" data-control="tuneUp" aria-label="O: tune radio up">O</button>
            <button class="control control-x" type="button" data-control="tuneDown" aria-label="X: tune radio down">X</button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
